spring.application.name=HSF302_RENTALCAR_HE194290
server.port=8080

# SQL Server - database FUCarRentingSystemDB
# Có thể đổi user/password bằng biến môi trường DB_USERNAME / DB_PASSWORD
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FUCarRentingSystemDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Spring Data JPA tự tạo/cập nhật các bảng
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
