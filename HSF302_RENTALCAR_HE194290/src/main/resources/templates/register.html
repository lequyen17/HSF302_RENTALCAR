<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="bg-light">
<div class="container py-4" style="max-width: 800px;">
	<div class="card shadow-sm">
		<div class="card-body p-4">
			<h4 class="mb-3">Register a customer account</h4>
			<form th:action="@{/register}" th:object="${form}" method="post">
					<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
						<div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
					</div>
				<div class="row g-3">
					<div class="col-md-6">
						<label class="form-label">Full name</label>
						<input type="text" th:field="*{fullName}" class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
						<div class="invalid-feedback" th:errors="*{fullName}"></div>
					</div>
					<div class="col-md-6">
						<label class="form-label">Mobile</label>
						<input type="text" th:field="*{mobile}" class="form-control" th:classappend="${#fields.hasErrors('mobile')} ? 'is-invalid'">
						<div class="invalid-feedback" th:errors="*{mobile}"></div>
					</div>
					<div class="col-md-6">
						<label class="form-label">Birthday</label>
						<input type="date" th:field="*{birthday}" class="form-control" th:classappend="${#fields.hasErrors('birthday')} ? 'is-invalid'">
						<div class="invalid-feedback" th:errors="*{birthday}"></div>
					</div>
					<div class="col-md-6">
						<label class="form-label">Identity card</label>
						<input type="text" th:field="*{identityCard}" class="form-control" th:classappend="${#fields.hasErrors('identityCard')} ? 'is-invalid'">
						<div class="invalid-feedback" th:errors="*{identityCard}"></div>
					</div>
					<div class="col-md-6">
						<label class="form-label">Licence number</label>
						<input type="text" th:field="*{licenceNumber}" class="form-control" th:classappend="${#fields.hasErrors('licenceNumber')} ? 'is-invalid'">
						<div class="invalid-feedback" th:errors="*{licenceNumber}"></div>
					</div>
					<div class="col-md-6">
						<label class="form-label">Licence date</label>
						<input type="date" th:field="*{licenceDate}" class="form-control" th:classappend="${#fields.hasErrors('licenceDate')} ? 'is-invalid'">
						<div class="invalid-feedback" th:errors="*{licenceDate}"></div>
					</div>
					<div class="col-md-4">
						<label class="form-label">Account name</label>
						<input type="text" th:field="*{accountName}" class="form-control" th:classappend="${#fields.hasErrors('accountName')} ? 'is-invalid'">
						<div class="invalid-feedback" th:errors="*{accountName}"></div>
					</div>
					<div class="col-md-4">
						<label class="form-label">Email</label>
						<input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
						<div class="invalid-feedback" th:errors="*{email}"></div>
					</div>
					<div class="col-md-4">
						<label class="form-label">Password</label>
						<input type="password" th:field="*{password}" class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
						<div class="form-text">At least 6 characters</div>
						<div class="invalid-feedback" th:errors="*{password}"></div>
					</div>
				</div>
				<div class="mt-4">
					<button class="btn btn-primary">Register</button>
					<a class="btn btn-link" th:href="@{/login}">Back to login</a>
				</div>
			</form>
		</div>
	</div>
</div>
</body>
</html>
