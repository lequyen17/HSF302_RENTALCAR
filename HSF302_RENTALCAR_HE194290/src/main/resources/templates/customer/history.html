<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>History - FUCarRentingSystem</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
	<div class="container">
		<a class="navbar-brand" th:href="@{/}">FUCarRentingSystem</a>
		<ul class="navbar-nav me-auto" th:if="${session.role == 'Admin'}">
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/cars}">Cars</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/customers}">Customers</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/rentals}">Rentals</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/reports}">Report</a></li>
		</ul>
		<ul class="navbar-nav me-auto" th:if="${session.role == 'Customer'}">
			<li class="nav-item"><a class="nav-link" th:href="@{/customer/rent}">Rent a car</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/customer/history}">History</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/customer/profile}">Profile</a></li>
		</ul>
		<ul class="navbar-nav ms-auto" th:if="${session.role != null}">
			<li class="nav-item"><span class="navbar-text me-3"
				th:text="${session.displayName} + ' (' + ${session.role} + ')'"></span></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/logout}">Logout</a></li>
		</ul>
	</div>
</nav>
<div class="container">
	<h3>Transaction history</h3>
		<div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
		<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
	<table class="table table-striped align-middle">
		<thead><tr><th>ID</th><th>Car</th><th>Pickup</th><th>Return</th><th>Price</th><th>Status</th><th></th></tr></thead>
		<tbody>
		<tr th:each="r : ${rentals}">
			<td th:text="${r.carRentId}"></td>
			<td th:text="${r.carName}"></td>
			<td th:text="${r.pickupDate}"></td>
			<td th:text="${r.returnDate}"></td>
			<td th:text="${#numbers.formatDecimal(r.rentPrice, 0, 'COMMA', 0, 'POINT')}"></td>
			<td th:text="${r.status}"></td>
			<td>
				<form th:if="${r.status == 'Active'}" th:action="@{/customer/rentals/{id}/cancel(id=${r.carRentId})}"
					method="post" onsubmit="return confirm('Cancel this transaction?');">
					<button class="btn btn-sm btn-outline-danger">Cancel</button>
				</form>
				<form th:if="${r.status == 'Completed' and !reviewed.contains(r.carRentId)}"
					th:action="@{/customer/rentals/{id}/review(id=${r.carRentId})}" method="post" class="d-flex gap-1">
					<select name="reviewStar" class="form-select form-select-sm" style="width: 70px;">
						<option th:each="i : ${#numbers.sequence(5, 1, -1)}" th:value="${i}" th:text="${i} + '★'"></option>
					</select>
					<input name="comment" class="form-control form-control-sm" placeholder="Comment" maxlength="500" required>
					<button class="btn btn-sm btn-outline-primary">Review</button>
				</form>
				<span th:if="${reviewed.contains(r.carRentId)}" class="text-muted small">Reviewed</span>
			</td>
		</tr>
		<tr th:if="${#lists.isEmpty(rentals)}"><td colspan="7" class="text-center text-muted">No transactions yet</td></tr>
		</tbody>
	</table>
</div>
</body>
</html>
