<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My rentals')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('history')}"></nav>
<main class="container">
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h3 class="page-title">Transaction history</h3>
		<a class="btn btn-primary" th:href="@{/}">+ Rent a car</a>
	</div>
	<div th:replace="~{fragments/layout :: alerts}"></div>
	<div class="card card-body">
		<table class="table table-striped align-middle datatable" data-order-col="2" data-order-dir="desc">
			<thead><tr><th>ID</th><th>Car</th><th>Pickup</th><th>Return</th><th>Price</th><th>Status</th><th data-orderable="false">Review</th><th data-orderable="false"></th></tr></thead>
			<tbody>
			<tr th:each="r : ${rentals}">
				<td th:text="${r.carRentId}"></td>
				<td><a th:href="@{/cars/{id}(id=${r.carId})}" class="text-decoration-none" th:text="${r.carName}"></a></td>
				<td th:text="${r.pickupDate}"></td>
				<td th:text="${r.returnDate}"></td>
				<td th:attr="data-order=${r.rentPrice}" th:text="${#numbers.formatDecimal(r.rentPrice, 0, 'COMMA', 0, 'POINT')}"></td>
				<td><span class="badge"
					th:classappend="${r.status == 'Active'} ? 'text-bg-primary' : (${r.status == 'Completed'} ? 'text-bg-success' : 'text-bg-secondary')"
					th:text="${r.status}"></span></td>
				<td>
					<th:block th:if="${reviews.containsKey(r.carRentId)}">
						<span th:replace="~{fragments/layout :: stars(${reviews.get(r.carRentId).reviewStar})}"></span>
					</th:block>
					<a th:if="${r.status == 'Completed' and !reviews.containsKey(r.carRentId)}" class="btn btn-sm btn-outline-primary"
						th:href="@{/customer/rentals/{id}/review(id=${r.carRentId})}">Write review</a>
					<span th:if="${r.status != 'Completed' and !reviews.containsKey(r.carRentId)}" class="text-muted small">After completion</span>
				</td>
				<td>
					<form th:if="${r.status == 'Active'}" th:action="@{/customer/rentals/{id}/cancel(id=${r.carRentId})}"
						method="post" onsubmit="return confirm('Cancel this transaction?');">
						<button class="btn btn-sm btn-outline-danger">Cancel</button>
					</form>
				</td>
			</tr>
			</tbody>
		</table>
	</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: datatables}"></th:block>
</body>
</html>
