<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Car details')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('home')}"></nav>
<main class="container">
	<div th:replace="~{fragments/layout :: alerts}"></div>

	<div class="row g-4">
		<div class="col-lg-7">
			<div class="car-thumb car-hero-thumb mb-4">
				<img th:if="${car.imageUrl}" th:src="${car.imageUrl}" th:alt="${car.carName}">
				<span th:unless="${car.imageUrl}">🚗</span>
			</div>

			<h5>Description</h5>
			<p th:text="${car.description}"></p>

			<h5 class="mt-4">Reviews
				<span th:if="${car.avgRating != null}" class="fs-6 fw-normal text-muted"
					th:text="'(' + ${#numbers.formatDecimal(car.avgRating, 1, 1)} + ' / 5 from ' + ${car.reviewCount} + ')'"></span>
			</h5>
			<div th:each="r : ${reviews}" class="border-top py-2">
				<b th:text="${r.customerName}"></b>
				<span th:replace="~{fragments/layout :: stars(${r.reviewStar})}"></span>
				<div class="text-muted" th:text="${r.comment}"></div>
			</div>
			<p class="text-muted" th:if="${#lists.isEmpty(reviews)}">No reviews yet.</p>
		</div>

		<div class="col-lg-5">
			<div class="card card-body mb-3">
				<h3 th:text="${car.carName}"></h3>
				<div class="fs-5 mb-3">
					<span class="car-price" th:text="${#numbers.formatDecimal(car.rentPrice, 0, 'COMMA', 0, 'POINT')}"></span>
					<span class="text-muted fs-6">/ day</span>
				</div>
				<table class="table table-sm mb-0">
					<tr><td class="text-muted">Producer</td><td th:text="${car.producerName}"></td></tr>
					<tr><td class="text-muted">Model year</td><td th:text="${car.carModelYear}"></td></tr>
					<tr><td class="text-muted">Seats</td><td th:text="${car.capacity}"></td></tr>
					<tr><td class="text-muted">Color</td><td th:text="${car.color}"></td></tr>
				</table>
			</div>

			<div class="card card-body" th:if="${car.status != 'Inactive' and session.role != 'Admin'}">
				<h5>Rent this car</h5>
				<form th:action="@{/cars/{id}(id=${car.carId})}" method="get" class="row g-2 mb-3">
					<div class="col-6"><input type="date" name="pickupDate" th:value="${pickupDate}" class="form-control" required></div>
					<div class="col-6"><input type="date" name="returnDate" th:value="${returnDate}" class="form-control" required></div>
					<div class="col-12"><button class="btn btn-outline-primary w-100">Check availability</button></div>
				</form>

				<div th:if="${checked and available}">
					<p>Available · <span th:text="${days}"></span> day(s) ·
						Total <b th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')}"></b></p>
					<form th:if="${session.role == 'Customer'}" th:action="@{/customer/rent}" method="post">
						<input type="hidden" name="carIds" th:value="${car.carId}">
						<input type="hidden" name="pickupDate" th:value="${pickupDate}">
						<input type="hidden" name="returnDate" th:value="${returnDate}">
						<button class="btn btn-primary w-100">Rent this car</button>
					</form>
					<a th:if="${session.role == null}" class="btn btn-primary w-100"
						th:href="@{/customer/rent(carId=${car.carId}, pickupDate=${pickupDate}, returnDate=${returnDate})}">Login to rent</a>
				</div>
				<div class="alert alert-warning mb-0" th:if="${checked and !available}">
					This car is not available for those dates.
				</div>
			</div>
			<div class="alert alert-secondary" th:if="${car.status == 'Inactive'}">This car is not available for rent.</div>
		</div>
	</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
