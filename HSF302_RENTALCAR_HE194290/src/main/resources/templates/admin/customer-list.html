<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Customers')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('customers')}"></nav>
<div class="container">
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h3>Customer management</h3>
		<a class="btn btn-primary" th:href="@{/admin/customers/new}">+ New customer</a>
	</div>
	<div th:replace="~{fragments/layout :: alerts}"></div>
	<div class="card card-body">
		<table class="table table-striped align-middle datatable" data-order-col="0" data-order-dir="asc">
		<thead><tr><th>ID</th><th>Full name</th><th>Email</th><th>Mobile</th><th>Birthday</th>
			<th>Identity card</th><th>Licence</th><th data-orderable="false"></th></tr></thead>
		<tbody>
		<tr th:each="c : ${customers}">
			<td th:text="${c.customerId}"></td>
			<td th:text="${c.fullName}"></td>
			<td th:text="${c.email}"></td>
			<td th:text="${c.mobile}"></td>
			<td th:text="${c.birthday}"></td>
			<td th:text="${c.identityCard}"></td>
			<td th:text="${c.licenceNumber} + ' (' + ${c.licenceDate} + ')'"></td>
			<td class="text-nowrap">
				<a class="btn btn-sm btn-outline-primary" th:href="@{/admin/customers/edit/{id}(id=${c.customerId})}">Edit</a>
				<form class="d-inline" th:action="@{/admin/customers/delete/{id}(id=${c.customerId})}" method="post"
					onsubmit="return confirm('Delete this customer?');">
					<button class="btn btn-sm btn-outline-danger">Delete</button>
				</form>
			</td>
		</tr>
		</tbody>
	</table>
	</div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: datatables}"></th:block>
</body>
</html>
