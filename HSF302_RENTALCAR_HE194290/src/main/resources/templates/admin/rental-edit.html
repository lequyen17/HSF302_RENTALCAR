<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Edit rental - FUCarRentingSystem</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
	<div class="container">
		<a class="navbar-brand" th:href="@{/}">FUCarRentingSystem</a>
		<ul class="navbar-nav me-auto" th:if="${session.role == 'Admin'}">
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/cars}">Cars</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/customers}">Customers</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/rentals}">Rentals</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/reports}">Report</a></li>
		</ul>
		<ul class="navbar-nav me-auto" th:if="${session.role == 'Customer'}">
			<li class="nav-item"><a class="nav-link" th:href="@{/customer/rent}">Rent a car</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/customer/history}">History</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/customer/profile}">Profile</a></li>
		</ul>
		<ul class="navbar-nav ms-auto" th:if="${session.role != null}">
			<li class="nav-item"><span class="navbar-text me-3"
				th:text="${session.displayName} + ' (' + ${session.role} + ')'"></span></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/logout}">Logout</a></li>
		</ul>
	</div>
</nav>
<div class="container" style="max-width: 700px;">
	<h3 th:text="'Edit rental #' + ${rental.carRentId}"></h3>
		<div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
		<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
	<p>Customer: <b th:text="${rental.customerName}"></b> &middot; Car: <b th:text="${rental.carName}"></b></p>
	<form th:action="@{/admin/rentals/update/{id}(id=${rental.carRentId})}" method="post" class="row g-3">
		<div class="col-md-4">
			<label class="form-label">Pickup date</label>
			<input type="date" name="pickupDate" th:value="${rental.pickupDate}" class="form-control" required>
		</div>
		<div class="col-md-4">
			<label class="form-label">Return date</label>
			<input type="date" name="returnDate" th:value="${rental.returnDate}" class="form-control" required>
		</div>
		<div class="col-md-4">
			<label class="form-label">Status</label>
			<select name="status" class="form-select">
				<option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == rental.status}"></option>
			</select>
		</div>
		<div class="col-12">
			<button class="btn btn-primary">Save</button>
			<a class="btn btn-link" th:href="@{/admin/rentals}">Cancel</a>
		</div>
	</form>
</div>
</body>
</html>
