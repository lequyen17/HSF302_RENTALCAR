<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit rental')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('rentals')}"></nav>
<div class="container" style="max-width: 700px;">
	<h3 th:text="'Edit rental #' + ${rental.carRentId}"></h3>
	<div th:replace="~{fragments/layout :: alerts}"></div>
	<p>Customer: <b th:text="${rental.customerName}"></b> &middot; Car: <b th:text="${rental.carName}"></b></p>
	<form th:action="@{/admin/rentals/update/{id}(id=${rental.carRentId})}" method="post" class="row g-3">
		<div class="col-md-4">
			<label class="form-label">Pickup date</label>
			<input type="date" name="pickupDate" th:value="${rental.pickupDate}" class="form-control" required>
		</div>
		<div class="col-md-4">
			<label class="form-label">Return date</label>
			<input type="date" name="returnDate" th:value="${rental.returnDate}" class="form-control" required>
		</div>
		<div class="col-md-4">
			<label class="form-label">Status</label>
			<select name="status" class="form-select">
				<option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == rental.status}"></option>
			</select>
		</div>
		<div class="col-12">
			<button class="btn btn-primary">Save</button>
			<a class="btn btn-link" th:href="@{/admin/rentals}">Cancel</a>
		</div>
	</form>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
