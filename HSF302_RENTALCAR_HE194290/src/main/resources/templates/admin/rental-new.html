<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>New rental - FUCarRentingSystem</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
	<div class="container">
		<a class="navbar-brand" th:href="@{/}">FUCarRentingSystem</a>
		<ul class="navbar-nav me-auto" th:if="${session.role == 'Admin'}">
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/cars}">Cars</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/customers}">Customers</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/rentals}">Rentals</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/reports}">Report</a></li>
		</ul>
		<ul class="navbar-nav me-auto" th:if="${session.role == 'Customer'}">
			<li class="nav-item"><a class="nav-link" th:href="@{/customer/rent}">Rent a car</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/customer/history}">History</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/customer/profile}">Profile</a></li>
		</ul>
		<ul class="navbar-nav ms-auto" th:if="${session.role != null}">
			<li class="nav-item"><span class="navbar-text me-3"
				th:text="${session.displayName} + ' (' + ${session.role} + ')'"></span></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/logout}">Logout</a></li>
		</ul>
	</div>
</nav>
<div class="container" style="max-width: 900px;">
	<h3>New rental transaction</h3>
		<div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
		<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
	<form th:action="@{/admin/rentals/save}" method="post">
		<div class="row g-3 mb-3">
			<div class="col-md-6">
				<label class="form-label">Customer</label>
				<select name="customerId" class="form-select" required>
					<option value="">-- select --</option>
					<option th:each="c : ${customers}" th:value="${c.customerId}"
						th:text="${c.fullName} + ' (' + ${c.email} + ')'"></option>
				</select>
			</div>
			<div class="col-md-3">
				<label class="form-label">Pickup date</label>
				<input type="date" name="pickupDate" class="form-control" required>
			</div>
			<div class="col-md-3">
				<label class="form-label">Return date</label>
				<input type="date" name="returnDate" class="form-control" required>
			</div>
		</div>
		<label class="form-label">Cars (select one or many)</label>
		<table class="table table-sm align-middle">
			<tbody>
			<tr th:each="c : ${cars}">
				<td style="width: 40px;"><input class="form-check-input" type="checkbox" name="carIds" th:value="${c.carId}"></td>
				<td th:text="${c.carName} + ' (' + ${c.carModelYear} + ', ' + ${c.color} + ')'"></td>
				<td th:text="${c.capacity} + ' seats'"></td>
				<td th:text="${#numbers.formatDecimal(c.rentPrice, 0, 'COMMA', 0, 'POINT')} + ' / day'"></td>
			</tr>
			<tr th:if="${#lists.isEmpty(cars)}"><td class="text-muted">No available cars</td></tr>
			</tbody>
		</table>
		<button class="btn btn-primary">Create</button>
		<a class="btn btn-link" th:href="@{/admin/rentals}">Cancel</a>
	</form>
</div>
</body>
</html>
