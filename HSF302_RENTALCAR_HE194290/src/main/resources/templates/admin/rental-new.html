<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('New rental')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('rentals')}"></nav>
<main class="container" style="max-width: 900px;">
	<h3 class="page-title mb-1">New rental transaction</h3>
	<p class="page-sub">Step 1: choose the rental dates. Step 2: choose the customer and the cars that are free in that period.</p>
	<div th:replace="~{fragments/layout :: alerts}"></div>

	<form class="card card-body mb-4" th:action="@{/admin/rentals/new}" method="get">
		<div class="row g-3 align-items-end">
			<div class="col-md-4 col-6">
				<label class="form-label">Pickup date</label>
				<input type="date" name="pickupDate" th:value="${pickupDate}" class="form-control" required>
			</div>
			<div class="col-md-4 col-6">
				<label class="form-label">Return date</label>
				<input type="date" name="returnDate" th:value="${returnDate}" class="form-control" required>
			</div>
			<div class="col-md-4"><button class="btn btn-primary w-100">Show available cars</button></div>
		</div>
	</form>

	<form th:if="${cars != null}" th:action="@{/admin/rentals/save}" method="post">
		<input type="hidden" name="pickupDate" th:value="${pickupDate}">
		<input type="hidden" name="returnDate" th:value="${returnDate}">
		<div class="mb-3">
			<label class="form-label">Customer</label>
			<select name="customerId" class="form-select" required>
				<option value="">-- select --</option>
				<option th:each="c : ${customers}" th:value="${c.customerId}"
					th:text="${c.fullName} + ' (' + ${c.email} + ')'"></option>
			</select>
		</div>
		<label class="form-label">Available cars <span th:text="${pickupDate} + ' → ' + ${returnDate}"></span> (select one or many)</label>
		<div class="table-card mb-3">
			<table class="table table-sm align-middle">
				<tbody>
				<tr th:each="c : ${cars}">
					<td style="width: 40px;"><input class="form-check-input" type="checkbox" name="carIds" th:value="${c.carId}"></td>
					<td th:text="${c.carName} + ' (' + ${c.carModelYear} + ', ' + ${c.color} + ')'"></td>
					<td th:text="${c.capacity} + ' seats'"></td>
					<td th:text="${#numbers.formatDecimal(c.rentPrice, 0, 'COMMA', 0, 'POINT')} + ' / day'"></td>
				</tr>
				<tr th:if="${#lists.isEmpty(cars)}"><td class="text-muted text-center py-3">No cars are free in this period</td></tr>
				</tbody>
			</table>
		</div>
		<button class="btn btn-primary">Create</button>
		<a class="btn btn-link" th:href="@{/admin/rentals}">Cancel</a>
	</form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
