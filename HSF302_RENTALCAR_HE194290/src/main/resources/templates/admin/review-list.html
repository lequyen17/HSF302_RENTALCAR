<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reviews')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('reviews')}"></nav>
<main class="container">
	<h3 class="page-title mb-3">Customer reviews</h3>
	<div th:replace="~{fragments/layout :: alerts}"></div>
	<div class="card card-body">
		<table class="table table-striped align-middle datatable" data-order-col="0" data-order-dir="desc">
			<thead><tr><th>ID</th><th>Car</th><th>Customer</th><th>Rental</th><th>Rating</th><th>Comment</th><th data-orderable="false"></th></tr></thead>
			<tbody>
			<tr th:each="r : ${reviews}">
				<td th:text="${r.id}"></td>
				<td><a th:href="@{/cars/{id}(id=${r.carId})}" class="text-decoration-none" th:text="${r.carName}"></a></td>
				<td th:text="${r.customerName}"></td>
				<td th:text="'#' + ${r.carRentId}"></td>
				<td th:attr="data-order=${r.reviewStar}"><span th:replace="~{fragments/layout :: stars(${r.reviewStar})}"></span></td>
				<td style="max-width: 360px;" th:text="${r.comment}"></td>
				<td>
					<form th:action="@{/admin/reviews/delete/{id}(id=${r.id})}" method="post"
						onsubmit="return confirm('Delete this review?');">
						<button class="btn btn-sm btn-outline-danger">Delete</button>
					</form>
				</td>
			</tr>
			</tbody>
		</table>
	</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: datatables}"></th:block>
</body>
</html>
