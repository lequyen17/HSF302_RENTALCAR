<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('dashboard')}"></nav>
<main class="container">
	<h3 class="page-title mb-3">Rental report</h3>

	<form class="card card-body mb-3" th:action="@{/admin/reports}" method="get">
		<div class="row g-3 align-items-end">
			<div class="col-md-3 col-6">
				<label class="form-label">Start date</label>
				<input type="date" name="startDate" th:value="${startDate}" class="form-control" required>
			</div>
			<div class="col-md-3 col-6">
				<label class="form-label">End date</label>
				<input type="date" name="endDate" th:value="${endDate}" class="form-control" required>
			</div>
			<div class="col-md-3"><button class="btn btn-primary w-100">Generate</button></div>
		</div>
	</form>
	<div th:replace="~{fragments/layout :: alerts}"></div>

	<div class="row g-3 mb-3">
		<div class="col-md-6"><div class="card card-body">
			<div class="text-muted">Revenue (excluding cancelled)</div>
			<div class="fs-3 fw-semibold" th:text="${#numbers.formatDecimal(report.revenue, 0, 'COMMA', 0, 'POINT')}"></div>
		</div></div>
		<div class="col-md-6"><div class="card card-body">
			<div class="text-muted">Transactions</div>
			<div class="fs-3 fw-semibold" th:text="${report.totalTransactions}"></div>
			<div class="small text-muted"><span th:text="${report.activeCount}"></span> active ·
				<span th:text="${report.completedCount}"></span> completed ·
				<span th:text="${report.cancelledCount}"></span> cancelled</div>
		</div></div>
	</div>

	<div class="card card-body">
		<table class="table table-striped align-middle datatable" data-order-col="3" data-order-dir="desc">
			<thead><tr><th>ID</th><th>Customer</th><th>Car</th><th>Pickup</th><th>Return</th><th>Price</th><th>Status</th></tr></thead>
			<tbody>
			<tr th:each="r : ${report.rentals}">
				<td th:text="${r.carRentId}"></td>
				<td th:text="${r.customerName}"></td>
				<td th:text="${r.carName}"></td>
				<td th:text="${r.pickupDate}"></td>
				<td th:text="${r.returnDate}"></td>
				<td th:attr="data-order=${r.rentPrice}" th:text="${#numbers.formatDecimal(r.rentPrice, 0, 'COMMA', 0, 'POINT')}"></td>
				<td th:text="${r.status}"></td>
			</tr>
			</tbody>
		</table>
	</div>
	<p class="text-muted small mt-2">Sorted by pickup date, newest first.</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: datatables}"></th:block>
</body>
</html>
