<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rentals')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('rentals')}"></nav>
<div class="container">
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h3>Rental management</h3>
		<a class="btn btn-primary" th:href="@{/admin/rentals/new}">+ New rental</a>
	</div>
	<div th:replace="~{fragments/layout :: alerts}"></div>
	<div class="card card-body">
		<table class="table table-striped align-middle datatable" data-order-col="3" data-order-dir="desc">
		<thead><tr><th>ID</th><th>Customer</th><th>Car</th><th>Pickup</th><th>Return</th>
			<th>Price</th><th>Status</th><th data-orderable="false"></th></tr></thead>
		<tbody>
		<tr th:each="r : ${rentals}">
			<td th:text="${r.carRentId}"></td>
			<td th:text="${r.customerName}"></td>
			<td th:text="${r.carName}"></td>
			<td th:text="${r.pickupDate}"></td>
			<td th:text="${r.returnDate}"></td>
			<td th:attr="data-order=${r.rentPrice}" th:text="${#numbers.formatDecimal(r.rentPrice, 0, 'COMMA', 0, 'POINT')}"></td>
			<td th:text="${r.status}"></td>
			<td class="text-nowrap">
				<a class="btn btn-sm btn-outline-primary" th:href="@{/admin/rentals/edit/{id}(id=${r.carRentId})}">Edit</a>
				<form class="d-inline" th:action="@{/admin/rentals/delete/{id}(id=${r.carRentId})}" method="post"
					onsubmit="return confirm('Delete this transaction?');">
					<button class="btn btn-sm btn-outline-danger">Delete</button>
				</form>
			</td>
		</tr>
		</tbody>
	</table>
	</div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: datatables}"></th:block>
</body>
</html>
