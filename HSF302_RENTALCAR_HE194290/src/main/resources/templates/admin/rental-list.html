<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Rentals - FUCarRentingSystem</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
	<div class="container">
		<a class="navbar-brand" th:href="@{/}">FUCarRentingSystem</a>
		<ul class="navbar-nav me-auto" th:if="${session.role == 'Admin'}">
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/cars}">Cars</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/customers}">Customers</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/rentals}">Rentals</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/reports}">Report</a></li>
		</ul>
		<ul class="navbar-nav me-auto" th:if="${session.role == 'Customer'}">
			<li class="nav-item"><a class="nav-link" th:href="@{/customer/rent}">Rent a car</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/customer/history}">History</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/customer/profile}">Profile</a></li>
		</ul>
		<ul class="navbar-nav ms-auto" th:if="${session.role != null}">
			<li class="nav-item"><span class="navbar-text me-3"
				th:text="${session.displayName} + ' (' + ${session.role} + ')'"></span></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/logout}">Logout</a></li>
		</ul>
	</div>
</nav>
<div class="container">
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h3>Rental management</h3>
		<a class="btn btn-primary" th:href="@{/admin/rentals/new}">+ New rental</a>
	</div>
		<div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
		<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
	<table class="table table-striped align-middle">
		<thead><tr><th>ID</th><th>Customer</th><th>Car</th><th>Pickup</th><th>Return</th>
			<th>Price</th><th>Status</th><th></th></tr></thead>
		<tbody>
		<tr th:each="r : ${rentals}">
			<td th:text="${r.carRentId}"></td>
			<td th:text="${r.customerName}"></td>
			<td th:text="${r.carName}"></td>
			<td th:text="${r.pickupDate}"></td>
			<td th:text="${r.returnDate}"></td>
			<td th:text="${#numbers.formatDecimal(r.rentPrice, 0, 'COMMA', 0, 'POINT')}"></td>
			<td th:text="${r.status}"></td>
			<td class="text-nowrap">
				<a class="btn btn-sm btn-outline-primary" th:href="@{/admin/rentals/edit/{id}(id=${r.carRentId})}">Edit</a>
				<form class="d-inline" th:action="@{/admin/rentals/delete/{id}(id=${r.carRentId})}" method="post"
					onsubmit="return confirm('Delete this transaction?');">
					<button class="btn btn-sm btn-outline-danger">Delete</button>
				</form>
			</td>
		</tr>
		<tr th:if="${#lists.isEmpty(rentals)}"><td colspan="8" class="text-center text-muted">No transactions</td></tr>
		</tbody>
	</table>
</div>
</body>
</html>
