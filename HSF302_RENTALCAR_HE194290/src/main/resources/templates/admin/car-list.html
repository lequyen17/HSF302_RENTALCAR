<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cars')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('cars')}"></nav>
<div class="container">
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h3>Car management</h3>
		<a class="btn btn-primary" th:href="@{/admin/cars/new}">+ New car</a>
	</div>
	<div th:replace="~{fragments/layout :: alerts}"></div>
	<div class="card card-body">
		<table class="table table-striped align-middle datatable" data-order-col="0" data-order-dir="asc">
		<thead><tr><th>ID</th><th data-orderable="false"></th><th>Name</th><th>Year</th><th>Color</th><th>Seats</th><th>Producer</th>
			<th>Import date</th><th>Price/day</th><th>Status</th><th data-orderable="false"></th></tr></thead>
		<tbody>
		<tr th:each="c : ${cars}">
			<td th:text="${c.carId}"></td>
			<td style="width: 90px;">
				<div class="rounded overflow-hidden d-flex align-items-center justify-content-center bg-light" style="width: 80px; height: 52px;">
					<img th:if="${c.imageUrl}" th:src="${c.imageUrl}" th:alt="${c.carName}" style="width: 100%; height: 100%; object-fit: cover;">
					<span th:unless="${c.imageUrl}" class="fs-4">🚗</span>
				</div>
			</td>
			<td><a th:href="@{/cars/{id}(id=${c.carId})}" class="text-decoration-none fw-semibold" th:text="${c.carName}"></a></td>
			<td th:text="${c.carModelYear}"></td>
			<td th:text="${c.color}"></td>
			<td th:text="${c.capacity}"></td>
			<td th:text="${c.producerName}"></td>
			<td th:text="${c.importDate}"></td>
			<td th:attr="data-order=${c.rentPrice}" th:text="${#numbers.formatDecimal(c.rentPrice, 0, 'COMMA', 0, 'POINT')}"></td>
			<td><span class="badge"
				th:classappend="${c.status == 'Available'} ? 'text-bg-success' : (${c.status == 'Rented'} ? 'text-bg-warning' : 'text-bg-secondary')"
				th:text="${c.status}"></span></td>
			<td class="text-nowrap">
				<a class="btn btn-sm btn-outline-primary" th:href="@{/admin/cars/edit/{id}(id=${c.carId})}">Edit</a>
				<form class="d-inline" th:action="@{/admin/cars/delete/{id}(id=${c.carId})}" method="post"
					onsubmit="return confirm('Delete this car?');">
					<button class="btn btn-sm btn-outline-danger">Delete</button>
				</form>
			</td>
		</tr>
		</tbody>
	</table>
	</div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: datatables}"></th:block>
</body>
</html>
