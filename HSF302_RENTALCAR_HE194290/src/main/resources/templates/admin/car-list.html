<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Cars - FUCarRentingSystem</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
	<div class="container">
		<a class="navbar-brand" th:href="@{/}">FUCarRentingSystem</a>
		<ul class="navbar-nav me-auto" th:if="${session.role == 'Admin'}">
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/cars}">Cars</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/customers}">Customers</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/rentals}">Rentals</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/reports}">Report</a></li>
		</ul>
		<ul class="navbar-nav me-auto" th:if="${session.role == 'Customer'}">
			<li class="nav-item"><a class="nav-link" th:href="@{/customer/rent}">Rent a car</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/customer/history}">History</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/customer/profile}">Profile</a></li>
		</ul>
		<ul class="navbar-nav ms-auto" th:if="${session.role != null}">
			<li class="nav-item"><span class="navbar-text me-3"
				th:text="${session.displayName} + ' (' + ${session.role} + ')'"></span></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/logout}">Logout</a></li>
		</ul>
	</div>
</nav>
<div class="container">
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h3>Car management</h3>
		<a class="btn btn-primary" th:href="@{/admin/cars/new}">+ New car</a>
	</div>
		<div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
		<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
	<form class="row g-2 mb-3" th:action="@{/admin/cars}" method="get">
		<div class="col-auto"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Search by name"></div>
		<div class="col-auto"><button class="btn btn-outline-secondary">Search</button></div>
	</form>
	<table class="table table-striped align-middle">
		<thead><tr><th>ID</th><th>Name</th><th>Year</th><th>Color</th><th>Seats</th><th>Producer</th>
			<th>Import date</th><th>Price/day</th><th>Status</th><th></th></tr></thead>
		<tbody>
		<tr th:each="c : ${cars}">
			<td th:text="${c.carId}"></td>
			<td th:text="${c.carName}"></td>
			<td th:text="${c.carModelYear}"></td>
			<td th:text="${c.color}"></td>
			<td th:text="${c.capacity}"></td>
			<td th:text="${c.producerName}"></td>
			<td th:text="${c.importDate}"></td>
			<td th:text="${#numbers.formatDecimal(c.rentPrice, 0, 'COMMA', 0, 'POINT')}"></td>
			<td><span class="badge"
				th:classappend="${c.status == 'Available'} ? 'text-bg-success' : (${c.status == 'Rented'} ? 'text-bg-warning' : 'text-bg-secondary')"
				th:text="${c.status}"></span></td>
			<td class="text-nowrap">
				<a class="btn btn-sm btn-outline-primary" th:href="@{/admin/cars/edit/{id}(id=${c.carId})}">Edit</a>
				<form class="d-inline" th:action="@{/admin/cars/delete/{id}(id=${c.carId})}" method="post"
					onsubmit="return confirm('Delete this car?');">
					<button class="btn btn-sm btn-outline-danger">Delete</button>
				</form>
			</td>
		</tr>
		<tr th:if="${#lists.isEmpty(cars)}"><td colspan="10" class="text-center text-muted">No cars</td></tr>
		</tbody>
	</table>
</div>
</body>
</html>
