<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Car - FUCarRentingSystem</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
	<div class="container">
		<a class="navbar-brand" th:href="@{/}">FUCarRentingSystem</a>
		<ul class="navbar-nav me-auto" th:if="${session.role == 'Admin'}">
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/cars}">Cars</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/customers}">Customers</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/rentals}">Rentals</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/admin/reports}">Report</a></li>
		</ul>
		<ul class="navbar-nav me-auto" th:if="${session.role == 'Customer'}">
			<li class="nav-item"><a class="nav-link" th:href="@{/customer/rent}">Rent a car</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/customer/history}">History</a></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/customer/profile}">Profile</a></li>
		</ul>
		<ul class="navbar-nav ms-auto" th:if="${session.role != null}">
			<li class="nav-item"><span class="navbar-text me-3"
				th:text="${session.displayName} + ' (' + ${session.role} + ')'"></span></li>
			<li class="nav-item"><a class="nav-link" th:href="@{/logout}">Logout</a></li>
		</ul>
	</div>
</nav>
<div class="container" style="max-width: 800px;">
	<h3 th:text="${car.carId == null} ? 'New car' : 'Edit car #' + ${car.carId}"></h3>
	<form th:action="@{/admin/cars/save}" th:object="${car}" method="post" class="row g-3">
		<input type="hidden" th:field="*{carId}">
		<div class="col-md-8">
			<label class="form-label">Car name</label>
			<input type="text" th:field="*{carName}" class="form-control" th:classappend="${#fields.hasErrors('carName')} ? 'is-invalid'">
			<div class="invalid-feedback" th:errors="*{carName}"></div>
		</div>
		<div class="col-md-4">
			<label class="form-label">Model year</label>
			<input type="number" th:field="*{carModelYear}" class="form-control" th:classappend="${#fields.hasErrors('carModelYear')} ? 'is-invalid'">
			<div class="invalid-feedback" th:errors="*{carModelYear}"></div>
		</div>
		<div class="col-md-4">
			<label class="form-label">Color</label>
			<input type="text" th:field="*{color}" class="form-control" th:classappend="${#fields.hasErrors('color')} ? 'is-invalid'">
			<div class="invalid-feedback" th:errors="*{color}"></div>
		</div>
		<div class="col-md-4">
			<label class="form-label">Capacity (seats)</label>
			<input type="number" th:field="*{capacity}" class="form-control" th:classappend="${#fields.hasErrors('capacity')} ? 'is-invalid'">
			<div class="invalid-feedback" th:errors="*{capacity}"></div>
		</div>
		<div class="col-md-4">
			<label class="form-label">Import date</label>
			<input type="date" th:field="*{importDate}" class="form-control" th:classappend="${#fields.hasErrors('importDate')} ? 'is-invalid'">
			<div class="invalid-feedback" th:errors="*{importDate}"></div>
		</div>
		<div class="col-md-4">
			<label class="form-label">Producer</label>
			<select th:field="*{producerId}" class="form-select" th:classappend="${#fields.hasErrors('producerId')} ? 'is-invalid'">
				<option value="">-- select --</option>
				<option th:each="p : ${producers}" th:value="${p.producerId}" th:text="${p.producerName}"></option>
			</select>
			<div class="invalid-feedback" th:errors="*{producerId}"></div>
		</div>
		<div class="col-md-4">
			<label class="form-label">Rent price / day</label>
			<input type="number" step="0.01" th:field="*{rentPrice}" class="form-control" th:classappend="${#fields.hasErrors('rentPrice')} ? 'is-invalid'">
			<div class="invalid-feedback" th:errors="*{rentPrice}"></div>
		</div>
		<div class="col-md-4">
			<label class="form-label">Status</label>
			<select th:field="*{status}" class="form-select">
				<option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
			</select>
		</div>
		<div class="col-12">
			<label class="form-label">Description</label>
			<textarea th:field="*{description}" rows="3" class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
			<div class="invalid-feedback" th:errors="*{description}"></div>
		</div>
		<div class="col-12">
			<button class="btn btn-primary">Save</button>
			<a class="btn btn-link" th:href="@{/admin/cars}">Cancel</a>
		</div>
	</form>
</div>
</body>
</html>
